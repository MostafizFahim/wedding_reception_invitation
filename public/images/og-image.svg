<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14463B"/>
      <stop offset="50%" stop-color="#0F3D33"/>
      <stop offset="100%" stop-color="#08221C"/>
    </linearGradient>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6BE"/>
      <stop offset="40%" stop-color="#DFC385"/>
      <stop offset="80%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#8D6D2B"/>
    </linearGradient>
    <linearGradient id="ogIvory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F2"/>
      <stop offset="100%" stop-color="#F7F1E3"/>
    </linearGradient>
    <pattern id="ogPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L36 18 L54 12 L48 30 L66 36 L48 42 L54 60 L36 54 L30 72 L24 54 L6 60 L12 42 L-6 36 L12 30 L6 12 L24 18 Z" 
            fill="none" stroke="#C9A45C" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Deep Emerald Backdrop -->
  <rect width="1200" height="630" fill="url(#ogEmerald)"/>
  <rect width="1200" height="630" fill="url(#ogPattern)"/>

  <!-- Outer Double Gold Border -->
  <rect x="35" y="35" width="1130" height="560" rx="12" fill="none" stroke="url(#ogGold)" stroke-width="2.5"/>
  <rect x="47" y="47" width="1106" height="536" rx="8" fill="none" stroke="url(#ogGold)" stroke-width="1" stroke-dasharray="4 6" opacity="0.75"/>

  <!-- Corner 8-Point Stars -->
  <g transform="translate(60, 60)"><rect x="-10" y="-10" width="20" height="20" fill="url(#ogGold)" transform="rotate(45)"/></g>
  <g transform="translate(1140, 60)"><rect x="-10" y="-10" width="20" height="20" fill="url(#ogGold)" transform="rotate(45)"/></g>
  <g transform="translate(60, 570)"><rect x="-10" y="-10" width="20" height="20" fill="url(#ogGold)" transform="rotate(45)"/></g>
  <g transform="translate(1140, 570)"><rect x="-10" y="-10" width="20" height="20" fill="url(#ogGold)" transform="rotate(45)"/></g>

  <!-- Center Luxury Card Surface (Ivory & Emerald Blend) -->
  <rect x="180" y="80" width="840" height="470" rx="16" fill="#0A2D24" stroke="url(#ogGold)" stroke-width="1.5"/>
  
  <!-- Arabic Bismillah -->
  <text x="600" y="145" font-family="'Amiri', 'Traditional Arabic', serif" font-size="30" fill="url(#ogGold)" text-anchor="middle" direction="rtl">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </text>

  <!-- Bou Bhat Tag -->
  <g transform="translate(600, 195)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#14463B" stroke="url(#ogGold)" stroke-width="1"/>
    <text x="0" y="6" font-family="'Hind Siliguri', sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#F5E6BE" text-anchor="middle">
      বিবাহোত্তর সংবর্ধনা • BOU BHAT
    </text>
  </g>

  <!-- Couple Names -->
  <text x="600" y="285" font-family="'Noto Serif Bengali', serif" font-size="56" font-weight="700" fill="url(#ogGold)" text-anchor="middle">
    ফাহিম &amp; জয়ী
  </text>
  <text x="600" y="340" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="6" fill="#FCF9F2" text-anchor="middle">
    FAHIM &amp; JOYEE
  </text>

  <!-- Delicate Gold Divider with Islamic Diamond -->
  <g transform="translate(600, 375)">
    <line x1="-180" y1="0" x2="-25" y2="0" stroke="url(#ogGold)" stroke-width="1.5" opacity="0.8"/>
    <rect x="-8" y="-8" width="16" height="16" fill="url(#ogGold)" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="3" fill="#0A2D24"/>
    <line x1="25" y1="0" x2="180" y2="0" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- Date & Venue -->
  <text x="600" y="430" font-family="'Noto Serif Bengali', serif" font-size="24" font-weight="600" fill="#DFC385" text-anchor="middle">
    ২৬ ডিসেম্বর ২০২৬, রোজ শনিবার • দুপুর ১:০০ ঘটিকা
  </text>
  <text x="600" y="470" font-family="'Hind Siliguri', sans-serif" font-size="20" fill="#FCF9F2" fill-opacity="0.9" text-anchor="middle">
    প্রকৌশলী কনভেনশন হল, জয়দেবপুর, গাজীপুর
  </text>
  <text x="600" y="505" font-family="'Inter', sans-serif" font-size="14" letter-spacing="3" fill="url(#ogGold)" text-anchor="middle">
    SATURDAY, 26 DECEMBER 2026 • JOYDEBPUR, GAZIPUR
  </text>
</svg>

    <text x="0" y="7" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="700" fill="url(#gold)" text-anchor="middle">01</text>
  </g>
  <text x="300" y="480" font-family="'Cormorant Garamond', serif" font-size="22" letter-spacing="4" fill="url(#gold)" text-anchor="middle">SACRED BEGINNINGS</text>
  <text x="300" y="515" font-family="'Hind Siliguri', sans-serif" font-size="16" letter-spacing="1" fill="#FCF9F2" fill-opacity="0.8" text-anchor="middle">শুভ সূচনা ও দোয়া</text>
  <line x1="220" y1="540" x2="380" y2="540" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <text x="300" y="580" font-family="'Inter', sans-serif" font-size="12" letter-spacing="2" fill="url(#gold)" text-anchor="middle" opacity="0.7">FAHIM &amp; JOYEE • 2026</text>

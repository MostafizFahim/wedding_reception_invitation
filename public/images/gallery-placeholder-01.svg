      <stop offset="100%" stop-color="#08221C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6BE"/>
      <stop offset="50%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#8D6D2B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg1)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="url(#gold)" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6"/>
  <!-- Center Star Motif -->
  <g transform="translate(300, 320)">

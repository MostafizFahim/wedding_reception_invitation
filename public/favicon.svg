<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pastelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8"/>
      <stop offset="50%" stop-color="#F9D5E0"/>
      <stop offset="100%" stop-color="#CDE8F8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Disc -->
  <circle cx="64" cy="64" r="60" fill="url(#pastelGrad)" stroke="#EFA9BF" stroke-width="2"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#8EC5E8" stroke-width="0.75" stroke-dasharray="2 3"/>

  <!-- 8-Point Islamic Star (Khatim) in Rose Accent -->
  <g transform="translate(64,64)">
    <rect x="-28" y="-28" width="56" height="56" fill="none" stroke="#B04C6C" stroke-width="1.8" rx="2"/>
    <rect x="-28" y="-28" width="56" height="56" fill="none" stroke="#B04C6C" stroke-width="1.8" rx="2" transform="rotate(45)"/>
    
    <circle cx="0" cy="0" r="13" fill="#FFF5F8" stroke="#EFA9BF" stroke-width="1"/>
    
    <!-- Monogram FJ -->
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" font-weight="700" fill="#B04C6C" text-anchor="middle" letter-spacing="1">FJ</text>
  </g>
</svg>

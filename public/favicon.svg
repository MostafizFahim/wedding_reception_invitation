<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3C77E"/>
      <stop offset="50%" stop-color="#B8913A"/>
      <stop offset="100%" stop-color="#7A5C14"/>
    </linearGradient>
    <radialGradient id="ivoryBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FBF6EA"/>
      <stop offset="100%" stop-color="#F6EEDC"/>
    </radialGradient>
  </defs>

  <!-- Background Ivory Disc with Gold Hairline -->
  <circle cx="64" cy="64" r="60" fill="url(#ivoryBg)" stroke="#B8913A" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#B8913A" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Interlocking Wedding Rings Motif in Gold with Crimson Center -->
  <g transform="translate(64, 64)">
    <!-- Left Ring -->
    <ellipse cx="-13" cy="0" rx="22" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <ellipse cx="-13" cy="0" rx="18" ry="18" fill="none" stroke="#E3C77E" stroke-width="1" opacity="0.8"/>

    <!-- Right Ring -->
    <ellipse cx="13" cy="0" rx="22" ry="22" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <ellipse cx="13" cy="0" rx="18" ry="18" fill="none" stroke="#E3C77E" stroke-width="1" opacity="0.8"/>

    <!-- Sparkling Diamond on Left Ring -->
    <polygon points="-13,-26 -9,-22 -13,-18 -17,-22" fill="#E3C77E" stroke="#7A5C14" stroke-width="0.5"/>

    <!-- Monogram FJ in Crimson -->
    <text x="0" y="5" font-family="'Cormorant Garamond', Georgia, serif" font-size="15" font-weight="700" fill="#7A1F2E" text-anchor="middle" letter-spacing="1.5">FJ</text>
  </g>
</svg>
